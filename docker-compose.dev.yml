services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: deps
    command: npm --workspace server run start:dev
    user: node
    working_dir: /app
    environment:
      NODE_ENV: development
      RUN_MIGRATIONS: "false"
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
      - uploads_data:/app/server/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: deps
    command: npm --workspace frontend run dev -- --hostname 0.0.0.0 --port 3001
    user: node
    working_dir: /app
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: 1
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      disable: true

volumes:
  backend_node_modules:
  frontend_node_modules:
